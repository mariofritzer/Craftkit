name: Build & Release

# Every push and pull request runs the tests.
# Publishing a release on GitHub (tag like "v1.0.0") builds CraftKit.exe and attaches it to that release.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        run: go test ./...

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CraftKit.exe
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#[vV]}"
          mkdir -p dist
          python3 tools/winres.py --version "${VERSION}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.appVersion=${VERSION}" \
            -o dist/CraftKit.exe .

      - name: Upload unsigned build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: CraftKit-unsigned
          path: dist/CraftKit.exe

      # Code signing via SignPath Foundation (free for open source).
      # Active once the repository variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN are set. Each signing request has to be approved on signpath.io.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: craftkit
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use signed build if available
        run: |
          if [ -f signed/CraftKit.exe ]; then cp signed/CraftKit.exe dist/CraftKit.exe; echo "signed build"; else echo "unsigned build"; fi
          cd dist && sha256sum CraftKit.exe > CraftKit.exe.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CraftKit.exe
            dist/CraftKit.exe.sha256
          tag_name: ${{ github.event.release.tag_name }}
